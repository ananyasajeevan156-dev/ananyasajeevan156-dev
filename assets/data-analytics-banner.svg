
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081827"/>
      <stop offset="100%" stop-color="#12374A"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#35C6B0"/>
      <stop offset="100%" stop-color="#55A9E8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#8DE5D8" opacity=".12">
    <path d="M0 70H1200 M0 140H1200 M0 210H1200"/>
    <path d="M100 0V300 M250 0V300 M400 0V300 M550 0V300"/>
  </g>

  <!-- Heading -->
  <text x="72" y="83" fill="#70DCCB"
        font-family="Arial" font-size="18" letter-spacing="5">
    DATA ANALYTICS PORTFOLIO
  </text>

  <!-- Name -->
  <text x="70" y="155" fill="#FFFFFF"
        font-family="Arial" font-size="48" font-weight="bold">
    ANANYA T S
  </text>

  <!-- Professional title -->
  <text x="74" y="202" fill="#B8D8E2"
        font-family="Arial" font-size="23">
    Data Analytics | Business Intelligence
  </text>

  <!-- Accent line -->
  <rect x="74" y="235" width="230" height="4"
        rx="2" fill="url(#line)"/>

  <!-- Tagline -->
  <text x="325" y="243" fill="#8FC8D1"
        font-family="Arial" font-size="14" letter-spacing="2">
    ANALYSE · VISUALISE · COMMUNICATE
  </text>

  <!-- Data chart -->
  <g fill="none" stroke="url(#line)" stroke-width="5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M825 205 L890 160 L950 180 L1010 105 L1065 130 L1130 65"/>
  </g>

  <!-- Chart points -->
  <g fill="#69DDCB">
    <circle cx="825" cy="205" r="6"/>
    <circle cx="890" cy="160" r="6"/>
    <circle cx="950" cy="180" r="6"/>
    <circle cx="1010" cy="105" r="6"/>
    <circle cx="1065" cy="130" r="6"/>
    <circle cx="1130" cy="65" r="6"/>
  </g>

  <circle cx="1000" cy="145" r="115"
          fill="#2CCBB3" opacity=".05"/>
</svg>
